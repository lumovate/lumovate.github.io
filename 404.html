/* Layout: one terminal screen, same amber world as the agent entrance of index.html */
:root{--t-bg:#0B0906;--t-fg:#FFB547;--t-mid:#E0AB5C;--t-dim:#A37A35;--t-hi:#FFE3B0;--t-line:#3B2C15;--t-scan:#FFB5470B;--t-glow:#FFB54766;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,"PingFang SC","Microsoft YaHei",monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--t-bg);color:var(--t-fg);font:400 1rem/1.7 var(--f-mono);
  background-image:repeating-linear-gradient(0deg,var(--t-scan) 0 1px,transparent 1px 3px);
  display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:min(640px,100%)}
h1{margin:0 0 18px;font-size:clamp(1.6rem,1.1rem + 2.4vw,2.8rem);line-height:1.15;color:var(--t-hi);text-shadow:0 0 18px var(--t-glow);overflow-wrap:anywhere}
p{margin:0 0 6px;color:var(--t-mid)}
.dim{color:var(--t-dim)}
a{color:var(--t-hi)}
nav{margin-top:28px;padding-top:16px;border-top:1px dashed var(--t-line);display:flex;flex-wrap:wrap;gap:8px 22px}
.cursor{display:inline-block;width:.55em;height:.95em;margin-left:.1em;background:var(--t-fg);vertical-align:-.08em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.cursor{animation:none}}
</style>
